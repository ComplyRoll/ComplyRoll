name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Compile
        run: python -m compileall -q src tests stigroll.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke-test console scripts and the source launcher
        run: |
          complyroll version
          stigroll tests/fixtures/windows-host.ckl --format json > /dev/null
          python stigroll.py tests/fixtures/ubuntu-host.cklb --format csv > /dev/null
