[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "complyroll"
version = "0.3.0a0"
description = "Evidence automation for continuous authorization"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Kyle Versluis" }
]
keywords = ["fedramp", "fedramp-20x", "vdr", "security", "compliance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema[format-nongpl]>=4.23,<5",
]

[project.urls]
Repository = "https://github.com/ComplyRoll/ComplyRoll"
Issues = "https://github.com/ComplyRoll/ComplyRoll/issues"

[project.scripts]
complyroll = "complyroll.cli:main"
stigroll = "complyroll.compat.stigroll:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
complyroll = ["data/*.json", "data/README.md", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The domain enums subclass (str, Enum) on purpose: members serialize through .value and
# str(member) must not silently change meaning; StrEnum is not a drop-in here.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
packages = ["complyroll"]
mypy_path = "src"

[[tool.mypy.overrides]]
# jsonschema ships no inline types and the project declares no stub dependency; the
# validator boundary is covered by tests rather than by static typing.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
