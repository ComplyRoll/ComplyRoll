name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Turns on the suite's wall-clock bounds, which tests/wall_clock.py gates.
      COMPLYROLL_TIMING_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Compile
        run: python -m compileall -q src tests stigroll.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke-test console scripts and the source launcher
        run: |
          complyroll version
          stigroll tests/fixtures/windows-host.ckl --format json > /dev/null
          python stigroll.py tests/fixtures/ubuntu-host.cklb --format csv > /dev/null

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The same SHA pins as the test job. Python 3.11 is the floor pyproject.toml targets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install . -r requirements-lint.txt
      - name: Ruff
        run: ruff check src tests stigroll.py
      - name: Ruff format
        # Formatter-clean since the one-time reformat (ADR 0017 amendment 2026-10-21).
        if: ${{ !cancelled() }}
        run: ruff format --check src tests stigroll.py
      - name: Mypy
        # Runs after a failed Ruff step too, so one run reports every gate.
        if: ${{ !cancelled() }}
        run: mypy
